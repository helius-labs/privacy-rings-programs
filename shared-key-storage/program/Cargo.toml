[package]
name = "storage"
version = "0.1.0"
description = "Chunked uploads and atomic replacement of per-owner records"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []

[dependencies]
pinocchio = { version = "0.11", features = ["cpi", "account-resize"] }
pinocchio-system = "0.6"
# Address::find_program_address on host builds; SBF builds use the syscall.
# `wincode` derives the instruction and account schemas over Address fields.
solana-address = { version = "2.6", features = ["curve25519", "wincode"] }
solana-msg = { version = "3.1", default-features = false }
# Chained upload hash; SBF builds use the sol_sha256 syscall.
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
thiserror = { version = "2", default-features = false }
wincode = { version = "0.6", default-features = false, features = ["derive"] }

[dev-dependencies]
mollusk-svm = "=0.13.4"
solana-account = "3.4"
# Address::new_unique in tests.
solana-address = { version = "2.6", features = ["atomic", "curve25519"] }
solana-instruction = "3.2"
solana-program-error = "3.0"
# wincode::serialize in tests.
wincode = { version = "0.6", default-features = false, features = ["alloc", "derive"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

[profile.release]
overflow-checks = true

[workspace]
