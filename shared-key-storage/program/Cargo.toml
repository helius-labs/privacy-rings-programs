[package]
name = "storage"
version = "0.1.0"
description = "Chunked uploads and atomic replacement of per-owner records"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Anchor emits the entrypoint unless `no-entrypoint` is set.
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
# Chained upload hash; SBF builds use the sol_sha256 syscall.
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
mollusk-svm = "=0.17.1"
# The Account and Instruction versions mollusk-svm 0.17 uses.
solana-account = "5"
# Address::new_unique in tests.
solana-address = { version = "2.6", features = ["atomic", "curve25519"] }
solana-instruction = "4"
# Runtime-level failures (e.g. PrivilegeEscalation) in mollusk results.
solana-instruction-error = "3"
solana-program-error = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

[profile.release]
overflow-checks = true

[workspace]
